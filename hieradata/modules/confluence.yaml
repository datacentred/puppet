confluence::javahome: 'usr'
confluence::version: '5.7.1'
confluence::facts_ensure: false
confluence::tomcat_port: '8080'
  postgresql:globals:
  encoding: 'UTF-8'
  locale: 'en_US.UTF-8'
postgresql::server::database_grant:
  confluencedb:
    privilege: 'ALL'
    db: 'confluencedb'
    role: 'confluenceadmin'

