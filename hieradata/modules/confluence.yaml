java::distribution: 'jdk'
confluence::javahome: 'usr'
confluence::version: '5.7.1'
confluence::facts_ensure: false
confluence::tomcat_port: '8080'
postgrsql::globals:
  encoding: 'UTF-8'
  locale: 'en_US.UTF-8'
postgresql::server::database_grant:
  confluencedb:
    privilege: 'ALL'
    db: 'confluencedb'
    role: 'confluenceadmin'
postgresql_password: ENC[PKCS7,] 
database_password: ENC[PKCS7,]

