---
classes:
  - '::dc_elasticsearch'
  - '::dc_profile::util::unattended_upgrades'
  - '::dc_icinga::hostgroup_elasticsearch'

sysctls::values:
    vm.swappiness:
        value: '0'

telegraf::inputs:
  elasticsearch:
    servers:
      - 'http://localhost:9200' 
    local: true
    cluster_health: true

dc_icinga2::services::disk::disk_wfree: '8'
dc_icinga2::services::disk::disk_cfree: '2'

