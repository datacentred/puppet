classes: 
        - 'dc_profile::util::website_wordpress'

nginx_locations:
  '~* \.php$':
    ensure: present
    www_root: '/var/www/datacentred.co.uk/'
    vhost: 'datacentred.co.uk'
    location: '~* \.php$'
    ssl: false
    try_files:
      - '$uri'
      - 'uri/'
      - 'index.php/?$args'
    fastcgi: 'unix:/var/run/php5-fpm.sock'
    location_cfg_append:
      fastcgi_split_path_info: '^(.+\.php)(.*)$'
      fastcgi_index: 'index.php'
      fastcgi_connect_timeout: '3m'
      fastcgi_read_timeout: '3m'
      fastcgi_send_timeout: '3m'
      fastcgi_buffers: '16 16k'
      fastcgi_buffer_size: '32k'

nginx_vhost:
  'datacentred.co.uk':
    ensure: present
    proxy: 'http://php'
    server_name: 
      - 'www.datacentred.co.uk'
      - 'datacentred.io'
      - 'datacentred.net'
      - 'datacentred.com'
      - 'datacentred.org'
      - 'datacentred.org.uk'
      - 'datacentred.io'
      - 'datacentred.net'
      - 'datacentred.com'
      - 'datacentred.org'
      - 'datacentred.org.uk'
    try_files: 
      - '$uri'
      - '$uri/'
      - 'index.php'
    index_files: 
      - 'index.php'
      - 'index.html'
      - 'index.htm'
#    vhost_cfg_append:
#      proxy_read_timeout: '90'
#      proxy_connect_timeout: '90'
#      proxy_redirect: 'off'
#      proxy_set_header: 'X-Forwarded-Proto https'
#      proxy_set_header: 'Host $host'
#      proxy_set_header: 'X-Real-IP $remote_addr'
#      proxy_set_header: 'X-Forwarded-For $proxy_add_x_forwarded_for'

nginx_upstream: 
  php:
    ensure: present  
    members: 
      - 'unix:/var/run/php5-fpm.sock'
