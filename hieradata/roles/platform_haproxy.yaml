---
classes:
  - '::dc_profile::net::loadbalancer'
  - '::dc_ssl::haproxy' # TODO: review whether to include in loadbalancer class

loadbalancer::keepalived_interfaces:
  VI_1:
    interface: 'bond0'
    virtual_router_id: 1
    virtual_ipaddress: "%{hiera('core_logstash_vip')}/24" #tbh this entire file can be moved, I mean the load balancer is going to go in front of new logstash in core
loadbalancer::haproxy_listeners:
  kibana:
    mode: 'http'
    bind:
      ':80': []
    options:
      balance: 'source'
  syslog:
    mode: 'http'
    bind:
      ':5544': []
    options:
      balance: 'source'
  courier:
    mode: 'tcp'
    bind:
      ':55516': []
    options:
      balance: 'source'
      timeout:
          - 'client 40m'
          - 'server 40m'
  beaver:
    mode: 'tcp'
    bind:
      ':9999': []
    options:
      balance: 'source'
      timeout:
          - 'client 40m'
          - 'server 40m'
  elasticsearch:
    mode: 'tcp'
    bind:
      ':9200': []
    options:
      balance: 'source'
loadbalancer::stats::ipaddress: "%{::ipaddress_bond0}"
sysctls::values:
  net.ipv4.ip_nonlocal_bind:
    value: '1'
