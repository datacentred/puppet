---
classes:
  - '::dc_profile::openstack::proxy'

haproxy::package_ensure: '1.5.14-1ubuntu0.15.10.1~ubuntu14.04.1'
haproxy::global_options:
        tune.bufsize: 32000
        log: '127.0.0.1 local0'
        chroot: '/var/lib/haproxy'
        pidfile: '/var/run/haproxy.pid'
        maxconn: '8000'
        user: 'haproxy'
        group: 'haproxy'
        stats: 'socket /var/lib/haproxy/stats'
        daemon: ''

listeners:
  haproxy-stats:
    mode: 'http'
    bind:
      ':1936':
        - 'ssl'
        - 'no-sslv3'
        - 'ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5'
        - 'crt /etc/ssl/private/puppet.crt'
        - 'ca-file /var/lib/puppet/ssl/certs/ca.pem'
        - 'verify required'
    options:
      stats:
        - 'enable'
        - 'uri /'
      rspadd: 'Strict-Transport-Security:\ max-age=31536000'
  galera:
    ipaddress: "%{hiera('os_api_vip')}"
    mode: 'tcp'
    ports: '3306'
    options:
      option:
        - 'httpchk'
      balance: 'source'
      'timeout client': '8h'
      'timeout server': '8h'
